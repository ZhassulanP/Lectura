services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: slidewise
      POSTGRES_USER: slidewise
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-slidewise}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - slidewise_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slidewise -d slidewise"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  slidewise_db:
